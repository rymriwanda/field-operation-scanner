<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Field Operation Collection</title>


  <!-- HTML5 QR CODE / BARCODE SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      font-family: Arial, sans-serif;

      background: #f5f6f8;

      margin: 0;

      padding: 20px;

    }


    .container {

      max-width: 520px;

      margin: auto;

      background: white;

      padding: 22px;

      border-radius: 18px;

      box-shadow:
        0 2px 12px rgba(0,0,0,0.08);

    }


    h2 {

      margin-top: 0;

      margin-bottom: 25px;

      font-size: 28px;

    }


    label {

      display: block;

      font-weight: bold;

      margin-top: 18px;

      margin-bottom: 7px;

    }


    input,
    select {

      width: 100%;

      padding: 13px;

      border: 1px solid #ccc;

      border-radius: 9px;

      font-size: 17px;

      background: white;

    }


    input[readonly] {

      background: #f7f7f7;

    }


    button {

      width: 100%;

      padding: 14px;

      margin-top: 10px;

      border: none;

      border-radius: 9px;

      font-size: 17px;

      font-weight: bold;

      background: #222;

      color: white;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    .scan-button {

      background: #222;

    }


    .submit-button {

      margin-top: 25px;

      background: #0b7a3e;

      font-size: 18px;

    }


    .cancel-button {

      background: #777;

    }


    #reader {

      width: 100%;

      margin-top: 15px;

      display: none;

      overflow: hidden;

      border-radius: 10px;

    }


    .status {

      margin-top: 18px;

      padding: 13px;

      border-radius: 9px;

      display: none;

      font-size: 16px;

    }


    .success {

      background: #e8f5e9;

      color: #2e7d32;

    }


    .error {

      background: #ffebee;

      color: #c62828;

    }


    .info {

      background: #e3f2fd;

      color: #1565c0;

    }


    .required {

      color: #d32f2f;

    }


    .scanner-title {

      margin-top: 15px;

      font-weight: bold;

    }

  </style>

</head>


<body>


<div class="container">


  <h2>
    Field Operation Collection
  </h2>


  <!-- ========================================= -->
  <!-- SUPPLIER -->
  <!-- ========================================= -->

  <label>
    Supplier Name
    <span class="required">*</span>
  </label>

  <select id="supplierName">

    <option value="">
      -- Select Supplier --
    </option>

    <option value="Alnia">
      Alnia
    </option>

    <option value="Nora">
      Nora
    </option>

    <option value="Staffinc">
      Staffinc
    </option>

  </select>


  <!-- ========================================= -->
  <!-- COLLECTOR -->
  <!-- ========================================= -->

  <label>
    Collector Name
    <span class="required">*</span>
  </label>

  <select id="collectorName">

    <option value="">
      -- Select Collector --
    </option>

    <option value="Firda">
      Firda
    </option>

    <option value="Sulis">
      Sulis
    </option>

    <option value="Rio">
      Rio
    </option>
    
    <option value="Ibek">
      Ibek
    </option>
    
  </select>


  <!-- ========================================= -->
  <!-- LOCATION -->
  <!-- ========================================= -->

  <label>
    Location Site
    <span class="required">*</span>
  </label>

  <select id="locationSite">

    <option value="">
      -- Select Site --
    </option>

    <option value="Semarang">
      Semarang
    </option>

    <option value="Surabaya">
      Surabaya
    </option>

    <option value="Surakarta">
      Surakarta
    </option>

    <option value="Sukoharjo">
      Sukoharjo
    </option>

    <option value="Jakarta">
      Jakarta
    </option>

    <option value="Bandung">
      Bandung
    </option>

  </select>


  <!-- ========================================= -->
  <!-- DEVICE ID -->
  <!-- ========================================= -->

  <label>
    Device ID
    <span class="required">*</span>
  </label>

  <input
    id="deviceId"
    type="text"
    placeholder="Scan Device ID"
    readonly
  >


  <button
    class="scan-button"
    onclick="startDeviceScanner()"
  >
    📷 Scan Device ID
  </button>


  <!-- ========================================= -->
  <!-- STORAGE ID -->
  <!-- ========================================= -->

  <label>
    Storage ID
    <span class="required">*</span>
  </label>

  <input
    id="storageId"
    type="text"
    placeholder="Scan SD Card / USB ID"
    readonly
  >


  <button
    class="scan-button"
    onclick="startStorageScanner()"
  >
    📷 Scan Storage ID
  </button>


  <!-- ========================================= -->
  <!-- SCANNER -->
  <!-- ========================================= -->

  <div id="reader"></div>


  <!-- ========================================= -->
  <!-- SCENE CATEGORY -->
  <!-- ========================================= -->

  <label>
    Scene Category
    <span class="required">*</span>
  </label>

  <select id="sceneCategory">

    <option value="">
      -- Select Scene Category --
    </option>

    <option value="Tailor">
      Tailor
    </option>

    <option value="Barber">
      Barber
    </option>

    <option value="Salon (Hair Stylist)">
      Salon (Hair Stylist)
    </option>

    <option value="Carpenter">
      Carpenter
    </option>

    <option value="Shoe Repair">
      Shoe Repair
    </option>

    <option value="Leatherworker">
      Carpenter
    </option>
    
    <option value="Carpenter">
      Carpenter
    </option>

    <option value="Mobile phone technician">
      Mobile phone technician
    </option>
    
    <option value="Motorcycle mechanic">
      Motorcycle mechanic
    </option>
    
    <option value="Bicycle mechanic">
      Bicycle mechanic
    </option>
    
    <option value="Tire technician">
      Tire technician
    </option>
    
    <option value="House painter">
      House painter
    </option>

    <option value="Vechicle mechanic">
      Vechicle mechanic
    </option>

    <option value="Laundry">
      Laundry
    </option>
    
  </select>


  <!-- ========================================= -->
  <!-- HOME SCENE -->
  <!-- ========================================= -->

  <label>
    Home Scene
    <span class="required">*</span>
  </label>

  <select id="homeScene">

    <option value="">
      -- Select Home Scene --
    </option>

    <option value="I">
      I
    </option>

    <option value="J">
      J
    </option>

    <option value="K">
      K
    </option>

    <option value="L">
      L
    </option>

    <option value="M">
      M
    </option>

    <option value="N">
      N
    </option>

    <option value="O">
      O
    </option>

    <option value="P">
      P
    </option>

    <option value="Q">
      Q
    </option>

    <option value="R">
      R
    </option>

    <option value="S">
      S
    </option>

    <option value="T">
      T
    </option>

  </select>


  <!-- ========================================= -->
  <!-- SUBMIT -->
  <!-- ========================================= -->

  <button
    class="submit-button"
    onclick="submitCollection()"
  >
    ✅ Submit Collection
  </button>


  <!-- ========================================= -->
  <!-- STATUS -->
  <!-- ========================================= -->

  <div
    id="status"
    class="status">
  </div>


</div>


<script>


/************************************************
 * GOOGLE APPS SCRIPT WEB APP URL
 ************************************************/

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxQPA54bQh-6Qx49bLqI1cu7aPuLMrBS4_RQ4dlAG0rsgyhcSXKAoSFGP4VW1A6ouGQZw/exec";


/************************************************
 * GLOBAL SCANNER
 ************************************************/

let scanner = null;

let scannerTarget = null;


/************************************************
 * START DEVICE SCANNER
 ************************************************/

function startDeviceScanner() {

  scannerTarget = "device";

  startScanner();

}


/************************************************
 * START STORAGE SCANNER
 ************************************************/

function startStorageScanner() {

  scannerTarget = "storage";

  startScanner();

}


/************************************************
 * START BARCODE SCANNER
 ************************************************/

function startScanner() {

  const reader =
    document.getElementById("reader");

  reader.style.display = "block";


  // Prevent multiple scanners
  if (scanner) {

    stopScanner();

  }


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 15,

    qrbox: {
      width: 300,
      height: 160
    },

    aspectRatio: 1.777,

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128

    ],

    rememberLastUsedCamera: true

  };


  scanner.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    config,


    function(decodedText) {

      console.log(
        "Barcode detected:",
        decodedText
      );


      /**************************************
       * DEVICE
       **************************************/

      if (scannerTarget === "device") {

        document.getElementById(
          "deviceId"
        ).value = decodedText;

        showStatus(
          "✅ Device ID terbaca: " +
          decodedText,
          "success"
        );

      }


      /**************************************
       * STORAGE
       **************************************/

      if (scannerTarget === "storage") {

        document.getElementById(
          "storageId"
        ).value = decodedText;

        showStatus(
          "✅ Storage ID terbaca: " +
          decodedText,
          "success"
        );

      }


      stopScanner();

    },


    function(errorMessage) {

      // Ignore scan errors
      // This runs continuously while camera
      // is looking for barcode.

    }

  )

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );


    showStatus(

      "❌ Camera tidak bisa dibuka.<br>" +
      error,

      "error"

    );

  });

}


/************************************************
 * STOP SCANNER
 ************************************************/

function stopScanner() {

  if (!scanner) {

    return;

  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

      document.getElementById(
        "reader"
      ).style.display = "none";

    })

    .catch(function(error) {

      console.log(
        "Stop scanner error:",
        error
      );

      scanner = null;

    });

}


/************************************************
 * SUBMIT COLLECTION
 ************************************************/

function submitCollection() {


  /**********************************************
   * GET VALUES
   **********************************************/

  const supplierName =
    document.getElementById(
      "supplierName"
    ).value;


  const collectorName =
    document.getElementById(
      "collectorName"
    ).value;


  const locationSite =
    document.getElementById(
      "locationSite"
    ).value;


  const deviceId =
    document.getElementById(
      "deviceId"
    ).value;


  const storageId =
    document.getElementById(
      "storageId"
    ).value;


  const sceneCategory =
    document.getElementById(
      "sceneCategory"
    ).value;


  const homeScene =
    document.getElementById(
      "homeScene"
    ).value;


  /**********************************************
   * VALIDATION
   **********************************************/

  if (!supplierName) {

    showStatus(
      "❌ Supplier Name wajib dipilih.",
      "error"
    );

    return;

  }


  if (!collectorName) {

    showStatus(
      "❌ Collector Name wajib dipilih.",
      "error"
    );

    return;

  }


  if (!locationSite) {

    showStatus(
      "❌ Location Site wajib dipilih.",
      "error"
    );

    return;

  }


  if (!deviceId) {

    showStatus(
      "❌ Device ID wajib di-scan.",
      "error"
    );

    return;

  }


  if (!storageId) {

    showStatus(
      "❌ Storage ID wajib di-scan.",
      "error"
    );

    return;

  }


  if (!sceneCategory) {

    showStatus(
      "❌ Scene Category wajib dipilih.",
      "error"
    );

    return;

  }


  if (!homeScene) {

    showStatus(
      "❌ Home Scene wajib dipilih.",
      "error"
    );

    return;

  }


  /**********************************************
   * PREPARE DATA
   **********************************************/

  const data = {

    supplierName:
      supplierName,

    collectorName:
      collectorName,

    locationSite:
      locationSite,

    deviceId:
      deviceId,

    storageId:
      storageId,

    sceneCategory:
      sceneCategory,

    homeScene:
      homeScene

  };


  /**********************************************
   * SHOW LOADING
   **********************************************/

  showStatus(
    "⏳ Menyimpan data...",
    "info"
  );


  /**********************************************
   * SEND TO GOOGLE APPS SCRIPT
   **********************************************/

  fetch(

    APPS_SCRIPT_URL,

    {

      method: "POST",

      mode: "no-cors",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(data)

    }

  )

  .then(function() {


    /********************************************
     * SUCCESS
     ********************************************/

    showStatus(

      "✅ Collection berhasil dikirim.<br><br>" +

      "Device ID: <b>" +
      deviceId +
      "</b><br>" +

      "Storage ID: <b>" +
      storageId +
      "</b>",

      "success"

    );


    /********************************************
     * RESET FORM
     ********************************************/

    document.getElementById(
      "deviceId"
    ).value = "";


    document.getElementById(
      "storageId"
    ).value = "";


    document.getElementById(
      "sceneCategory"
    ).value = "";


    document.getElementById(
      "homeScene"
    ).value = "";


  })

  .catch(function(error) {


    console.error(
      "Submit error:",
      error
    );


    showStatus(

      "❌ Gagal mengirim data.<br>" +
      error,

      "error"

    );

  });

}


/************************************************
 * SHOW STATUS
 ************************************************/

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "status " + type;


  status.style.display =
    "block";

}


</script>


</body>

</html>
